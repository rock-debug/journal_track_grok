{% extends 'base.html' %}

{% block title %}Edit Note - Journal & Patent Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="fa-solid fa-pen-to-square text-success me-2"></i>Edit Note</h2>
            <a href="{{ url_for('notes.index') }}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i>Cancel</a>
        </div>

        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('notes.edit', note_id=note.id) }}">
                    <div class="mb-3">
                        <label for="paper_id" class="form-label fw-semibold">Link to Research Paper (Optional)</label>
                        <select class="form-select bg-dark text-light border-dark" id="paper_id" name="paper_id">
                            <option value="">-- None (Standalone Note) --</option>
                            {% for p in papers %}
                            <option value="{{ p.id }}" {% if note.paper_id == p.id %}selected{% endif %}>{{ p.title }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="patent_id" class="form-label fw-semibold">Link to Patent (Optional)</label>
                        <select class="form-select bg-dark text-light border-dark" id="patent_id" name="patent_id">
                            <option value="">-- None (Standalone Note) --</option>
                            {% for pat in patents %}
                            <option value="{{ pat.id }}" {% if note.patent_id == pat.id %}selected{% endif %}>{{ pat.title }} ({{ pat.patent_number or 'No Number' }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fw-bold">Note Content <span class="text-danger">*</span></label>
                        <textarea class="form-control bg-dark text-light border-dark" id="content" name="content" rows="6" required>{{ note.content }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('notes.index') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-success px-4"><i class="fa-solid fa-save me-1"></i>Update Note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
