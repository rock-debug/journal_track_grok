apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-web
  namespace: research-tracker
  labels:
    app: tracker-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracker-web
  template:
    metadata:
      labels:
        app: tracker-web
    spec:
      containers:
      - name: tracker-container
        image: 342186379329.dkr.ecr.us-east-1.amazonaws.com/journal-tracker-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: tracker-config
        - secretRef:
            name: tracker-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
